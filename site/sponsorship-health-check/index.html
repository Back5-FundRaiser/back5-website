<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponsorship health check | Back5</title>
<meta name="description" content="Three minutes to see what a grassroots program would fix first for your brand.">
<link rel="canonical" href="https://www.back5.com.au/sponsorship-health-check/">
<meta property="og:title" content="Sponsorship health check | Back5">
<meta property="og:description" content="Three minutes to see what a grassroots program would fix first for your brand.">
<meta property="og:image" content="https://www.back5.com.au/assets/share.png">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;color:#ffffff;background:#111116;-webkit-font-smoothing:antialiased}
::selection{background:#F4450F;color:#111116}
a{color:#ffffff}a:hover{color:#F4450F}
:focus-visible{outline:3px solid #F4450F;outline-offset:3px}
h1:focus{outline:none}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
.b5-opt{transition:background-color .15s ease,color .15s ease}
.b5-go{transition:transform .2s cubic-bezier(.16,1,.3,1)}
.b5-go:hover:not(:disabled){transform:translateY(-2px)}
input{font-family:inherit}
@media (prefers-reduced-motion:reduce){.b5-opt,.b5-go{transition:none}.b5-go:hover:not(:disabled){transform:none}}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #111116; color: #ffffff">
<header style="max-width: 1080px; margin: 0 auto; padding: 22px clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="/" aria-label="Back5 home" style="display: flex"><img src="/assets/back5-logo-white.svg" alt="Back5" style="height: 44px; width: 132px; display: block"></a>
<div style="display: flex; align-items: center; gap: 24px; font-size: 16px; font-weight: 700">
<span id="b5-step" style="color: #d2d2d8">Step 1 of 3</span>
<a href="/for-brands/" style="text-underline-offset: 5px">Back to the site</a>
</div>
</header>
<main id="b5-app" style="max-width: 1080px; margin: 0 auto; padding: clamp(24px, 4vw, 56px) clamp(20px, 5vw, 64px) 96px">
<noscript><p style="font-size: 20px; line-height: 1.5">The sponsorship health check needs JavaScript. Turn it on in your browser, or get in touch and we'll go through it with you.</p></noscript>
</main>
</div>
<form name="health-check" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field"><input name="check"><input name="organisation"><input name="name"><input name="email">
<input name="start_here"><input name="also_consider"><textarea name="problems"></textarea><textarea name="answers"></textarea>
</form>
<script src="/assets/health-check.js"></script>
<script src="/assets/sponsorship-health-check.js"></script>
<script>B5Check.start({"kind": "Sponsorship health check", "pickTitle": "What isn't your sport sponsorship doing for you?", "pickIntro": "Pick everything that sounds familiar. We'll only ask about the things you choose.", "resultTitle": "Here's what a program would fix first.", "noFit": "From your answers, your sponsorship is already working hard. A short call might still turn up something at club level, so leave your details if you'd like one.", "formTitle": "Walk through it with us.", "formIntro": "Leave your details and we'll send this result to you, then set up a call on what a program could look like for your brand.", "orgLabel": "Company", "emailLabel": "Work email", "accent": "#F4450F"});</script>
</body>
</html>
