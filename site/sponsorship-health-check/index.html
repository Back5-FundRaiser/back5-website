<style>body{margin:0;font-family:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;color:#ffffff;background:#111116;-webkit-font-smoothing:antialiased}
::selection{background:#F4450F;color:#111116}
a{color:#ffffff}
:focus-visible{outline:3px solid #F4450F;outline-offset:3px}
form :focus-visible{outline-color:#F4450F}
h1:focus{outline:none}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
.b5-opt{transition:background-color .15s ease,color .15s ease}
.b5-opt:hover{border-color:#ffffff !important}
.b5-go{transition:transform .2s cubic-bezier(.16,1,.3,1)}
.b5-go:hover:not(:disabled){transform:translateY(-2px)}

@media (prefers-reduced-motion:reduce){.b5-opt,.b5-go{transition:none}.b5-go:hover:not(:disabled){transform:none}}

<body>
<div style="min-height: 100vh; background: #111116; color: #ffffff">
<header style="max-width: 1080px; margin: 0 auto; padding: 22px clamp(20px, 5vw, 64px) 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="/" aria-label="Back5 home" style="display: flex"><img src="/assets/back5-logo-white.svg" alt="Back5" style="height: 44px; width: 132px; display: block"></a>
<div style="display: flex; align-items: center; gap: 24px; font-size: 16px; font-weight: 700">
<span id="b5-step" style="color: #d2d2d8"></span>
<a href="/for-brands/" style="text-underline-offset: 5px">Back to the site</a>
</div>
</div>
<div id="b5-progress" aria-hidden="true" style="display: grid; gap: 6px"></div>
</header>
<main id="b5-app" style="max-width: 1080px; margin: 0 auto; padding: clamp(28px, 4vw, 56px) clamp(20px, 5vw, 64px) 96px">
<noscript><p style="font-size: 20px; line-height: 1.5">The sponsorship health check needs JavaScript. Turn it on in your browser, or email mark@back5.com.au and we'll go through it with you.</p></noscript>
</main>
</div>
<form name="health-check" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field"><input name="check"><input name="organisation"><input name="name"><input name="email"><input name="phone">
<input name="score"><textarea name="areas"></textarea><textarea name="priorities"></textarea><textarea name="answers"></textarea>
</form>
<script src="/assets/jspdf.umd.min.js?v=d93ad20f62" defer></script>
<script src="/assets/sponsorship-health-check.js?v=90f16027c4"></script>
<script src="/assets/health-check-report.js?v=0672768e68" defer></script>
<script src="/assets/health-check.js?v=29e4104148"></script>
<script>B5Check.start({"kind": "Sponsorship health check", "orgLabel": "Company", "emailLabel": "Work email", "accent": "#F4450F", "scoreTitle": "Your sponsorship scorecard", "prioritiesTitle": "Your three priorities", "fileWord": "sponsorship-scorecard", "report": {"title": "Your sponsorship health check", "prioritiesTitle": "Your three priorities", "improveTitle": "Where your sponsorship can improve", "improveIntro": "Based on your results, these are the three areas where your sponsorship has the greatest opportunity to improve.", "roadmapTitle": "Your sponsorship improvement roadmap", "contactCopy": "Want to talk through your results or see how Back5 could help your brand? I'd love to have a chat."}, "contactEmail": "mark@back5.com.au", "rep": {"name": "Mark", "email": "mark@back5.com.au", "site": "www.back5.com.au", "photo": "/assets/mark.png"}});</script>
